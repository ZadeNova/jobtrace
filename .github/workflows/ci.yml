name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobtrace
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: jobtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jobtrace -d jobtrace"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    env:
      POSTGRES_USER: jobtrace
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: jobtrace
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Create test database
        run: PGPASSWORD=changeme psql -h localhost -U jobtrace -d jobtrace -c "CREATE DATABASE jobtrace_test"

      - name: Test
        run: go test ./...
