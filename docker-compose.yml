services:
  postgres:
    image: postgres:16
    container_name: jobtrace-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - "jobtrace_pgdata:/var/lib/postgresql/data"
      - "./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  jobtrace_pgdata:
