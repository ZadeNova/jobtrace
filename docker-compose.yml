services:
  app:
    build: .
    container_name: jobtrace-app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: 5432
      POSTGRES_HOST: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: jobtrace-prometheus
    volumes:
      - "./observability/prometheus.yml:/etc/prometheus/prometheus.yml:z"
      - "jobtrace_prometheus_data:/prometheus"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: jobtrace-grafana
    ports:
      - "3000:3000"
    volumes:
      - "jobtrace_grafana_data:/var/lib/grafana"
      - "./observability/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:z"
      - "./observability/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:z"
      - "./observability/grafana/dashboards:/etc/grafana/dashboards:z"
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    container_name: jobtrace-loki
    ports:
      - "3100:3100"
    volumes:
      - "jobtrace_loki_data:/loki"
    command: -config.file=/etc/loki/local-config.yaml

  alloy:
    image: grafana/alloy:latest
    container_name: jobtrace-alloy
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro,z"
      - "./observability/alloy-config.alloy:/etc/alloy/alloy-config.alloy:z"
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/alloy-config.alloy
    ports:
      - "12345:12345"
    depends_on:
      - loki
    user: root

  postgres:
    image: postgres:16
    container_name: jobtrace-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - "jobtrace_pgdata:/var/lib/postgresql/data"
      - "./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:z"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  jobtrace_pgdata:
  jobtrace_prometheus_data:
  jobtrace_grafana_data:
  jobtrace_loki_data:
